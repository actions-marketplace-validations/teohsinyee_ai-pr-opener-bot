name: AI PR Opener Bot
description: Open a pull request with a GitHub App and optionally request a reviewer.
branding:
  icon: git-pull-request
  color: blue

inputs:
  app_id:
    description: GitHub App ID
    required: true
  private_key:
    description: GitHub App private key in PEM format
    required: true
  branch:
    description: Source branch to open the pull request from
    required: true
  base:
    description: Base branch to merge into
    required: false
    default: main
  title:
    description: Pull request title
    required: true
  body:
    description: Pull request body in Markdown
    required: false
    default: ""
  draft:
    description: Whether to open the pull request as a draft
    required: false
    default: "true"
  reviewer:
    description: Optional GitHub username to request for review
    required: false
    default: ""

outputs:
  pr-number:
    description: Pull request number
    value: ${{ steps.create-pr.outputs.pr-number }}
  pr-url:
    description: Pull request URL
    value: ${{ steps.create-pr.outputs.pr-url }}

runs:
  using: composite
  steps:
    - name: Validate required secrets
      shell: bash
      env:
        INPUT_APP_ID: ${{ inputs.app_id }}
        INPUT_PRIVATE_KEY: ${{ inputs.private_key }}
      run: |
        if [[ -z "$INPUT_APP_ID" ]]; then
          echo "::error::Input 'app_id' is required."
          exit 1
        fi

        if [[ -z "$INPUT_PRIVATE_KEY" ]]; then
          echo "::error::Input 'private_key' is required."
          exit 1
        fi

    - name: Create installation token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ inputs.app_id }}
        private-key: ${{ inputs.private_key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}

    - name: Validate inputs and branch state
      id: validate
      uses: actions/github-script@v7
      env:
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_BASE: ${{ inputs.base }}
      with:
        github-token: ${{ steps.app-token.outputs.token }}
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const branch = process.env.INPUT_BRANCH?.trim();
          const base = process.env.INPUT_BASE?.trim();

          if (!branch) {
            core.setFailed("Input 'branch' is required.");
            return;
          }

          if (!base) {
            core.setFailed("Input 'base' is required.");
            return;
          }

          if (branch === base) {
            core.setFailed("The source branch and base branch must be different.");
            return;
          }

          const ensureBranchExists = async (name, label) => {
            try {
              await github.rest.repos.getBranch({
                owner,
                repo,
                branch: name,
              });
            } catch (error) {
              if (error.status === 404) {
                core.setFailed(`${label} branch '${name}' was not found in ${owner}/${repo}.`);
                return false;
              }

              throw error;
            }

            return true;
          };

          const sourceExists = await ensureBranchExists(branch, "Source");
          if (!sourceExists) {
            return;
          }

          const baseExists = await ensureBranchExists(base, "Base");
          if (!baseExists) {
            return;
          }

          const existingPulls = await github.paginate(github.rest.pulls.list, {
            owner,
            repo,
            state: "open",
            head: `${owner}:${branch}`,
            base,
            per_page: 100,
          });

          if (existingPulls.length > 0) {
            const existing = existingPulls[0];
            core.setFailed(
              `An open pull request already exists for ${owner}:${branch} -> ${base}: ${existing.html_url}`
            );
            return;
          }

          core.setOutput("branch", branch);
          core.setOutput("base", base);

    - name: Create pull request and request review
      id: create-pr
      uses: actions/github-script@v7
      env:
        INPUT_TITLE: ${{ inputs.title }}
        INPUT_BODY: ${{ inputs.body }}
        INPUT_DRAFT: ${{ inputs.draft }}
        INPUT_REVIEWER: ${{ inputs.reviewer }}
        SOURCE_BRANCH: ${{ steps.validate.outputs.branch }}
        BASE_BRANCH: ${{ steps.validate.outputs.base }}
      with:
        github-token: ${{ steps.app-token.outputs.token }}
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const title = process.env.INPUT_TITLE?.trim();
          const body = process.env.INPUT_BODY ?? "";
          const draft = process.env.INPUT_DRAFT === "true";
          const reviewer = process.env.INPUT_REVIEWER?.trim();
          const head = process.env.SOURCE_BRANCH;
          const base = process.env.BASE_BRANCH;

          if (!title) {
            core.setFailed("Input 'title' is required.");
            return;
          }

          const { data: pullRequest } = await github.rest.pulls.create({
            owner,
            repo,
            title,
            head,
            base,
            body,
            draft,
          });

          core.info(`Created pull request #${pullRequest.number}: ${pullRequest.html_url}`);

          if (reviewer) {
            try {
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number: pullRequest.number,
                reviewers: [reviewer],
              });
            } catch (error) {
              core.setFailed(
                `Pull request ${pullRequest.html_url} was created, but requesting review from ${reviewer} failed: ${error.message}`
              );
              return;
            }
          }

          core.setOutput("pr-number", String(pullRequest.number));
          core.setOutput("pr-url", pullRequest.html_url);
